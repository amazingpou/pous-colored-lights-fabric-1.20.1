plugins { id 'java-library' }

base { archivesName = 'pous-colored-lights-core' }
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { withSourcesJar(); toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }

configurations { sharedJava { canBeResolved = false; canBeConsumed = true } }
artifacts { sharedJava sourceSets.main.java.sourceDirectories.singleFile }
